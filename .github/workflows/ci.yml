name: check

# Lint and typecheck on every push and pull request. Until now `tsc` only ran
# in an editor, so a type error could reach main without anything objecting.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Not `npm run check`: its tests need public/media, which is gitignored.
      - run: npm run lint
      - run: npx tsc --noEmit
